# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset
  # TEMPORARY debug build for diagnosing the right-half freeze (see conversation).
  # Flash this to the right half, connect it via USB-C to a computer, and open a
  # serial terminal on the USB CDC ACM device it enumerates as (independent of the
  # BLE link, so it works even though this half is a split peripheral). Reproduce
  # the freeze and capture the last log lines before output stops.
  # Remove this entry once done debugging.
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_INPUT_LOG_LEVEL_DBG=y
      -DCONFIG_I2C_LOG_LEVEL_DBG=y
      -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: toucan_right_debug
